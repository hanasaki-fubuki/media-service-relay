name: Android SDK
description: Provide Android SDK Platform 36 and Build Tools 36.0.0.

runs:
  using: composite
  steps:
    - name: Locate or install the Android SDK
      shell: bash
      run: |
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [[ -z "$sdk" || ! -f "$sdk/platforms/android-36/android.jar" || ! -x "$sdk/build-tools/36.0.0/apksigner" ]]; then
          sdk="$RUNNER_TEMP/relay-android-sdk"
          archive="$RUNNER_TEMP/relay-android-tools.zip"
          tools="$RUNNER_TEMP/relay-android-tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
          mkdir -p "$sdk" "$tools"
          unzip -q "$archive" -d "$tools"
          manager="$tools/cmdline-tools/bin/sdkmanager"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0"
        fi
        printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
