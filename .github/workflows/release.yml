name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Validate version
        run: |
          version=$(awk -F"'" '/^[[:space:]]*versionName[[:space:]]/{print $2; exit}' build.gradle)
          if [[ -z "$version" || "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s must match the Android versionName (%s).\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
      - uses: ./.github/actions/android-sdk
      - name: Build and lint release
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Missing release keystore}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/relay-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key"
          unset RELEASE_KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="Media-Service-Relay-${RELEASE_TAG#v}.apk"
          mkdir -p dist
          "$tools/zipalign" -P 16 -f 4 build/outputs/apk/release/MediaServiceRelay-release-unsigned.apk "$RUNNER_TEMP/relay-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-key-alias media-service-relay \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEYSTORE_PASSWORD \
            --out "dist/$apk" "$RUNNER_TEMP/relay-aligned.apk"
          "$tools/zipalign" -c -P 16 4 "dist/$apk"
          "$tools/apksigner" verify --verbose --print-certs "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="Media-Service-Relay-${RELEASE_TAG#v}.apk"
          gh release create "$RELEASE_TAG" "dist/$apk" "dist/$apk.sha256" \
            --verify-tag --title "Media Service Relay ${RELEASE_TAG#v}" --notes-from-tag
